name: 🧪 CI

# 모든 PR과 main/dev 브랜치 push 시 CI 실행
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      # 1. 레포지토리 소스 코드 체크아웃
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      # 2. pnpm 설치
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      # 3. Node.js LTS 환경 설정 + pnpm 캐시 활성화
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 4. pnpm-lock.yaml 기준으로 의존성 설치
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Turborepo 캐시 설정
      - name: ⚡ Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # 6. ESLint를 통한 코드 품질 검사
      - name: 🔍 Run ESLint
        run: pnpm lint

      # 7. Prettier 포맷 규칙 검사
      - name: 🎯 Check formatting
        run: pnpm format:check

      # 8. TypeScript 타입 안정성 검사
      - name: 🧠 Type check
        run: pnpm typecheck

      # 9. 패키지 빌드 검증 (Turborepo 캐싱)
      - name: 🏗️ Build packages
        run: pnpm build

      # 10. Storybook 빌드 검증
      - name: 📚 Build Storybook
        run: pnpm build-storybook
